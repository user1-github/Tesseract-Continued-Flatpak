id: io.github.Big_Onche.Tesseract-Continued
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tesseract
finish-args:
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --persist=.tesseract
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
modules:

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2IMAGE_DEPS_SHARED=OFF
      - -DSDL2IMAGE_STRICT=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: tesseract
    no-autogen: true
    subdir: src
    post-install:
      - mkdir -p /app/share/tesseract
      - cp -a ../config ../media /app/share/tesseract
      - install -Dm755 ../bin_unix/native_client -t /app/bin
      - install -Dm755 ../tesseract.sh /app/bin/tesseract
      - install -Dm644 ../media/interface/cube.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 ../io.github.Big_Onche.Tesseract-Continued.desktop -t /app/share/applications
    sources:
      - type: git
        url: https://github.com/Big-Onche/Tesseract-Continued.git
        commit: 99d942d0127c4dcbf82c7c1b584aa89aece458c2
      - type: file
        path: tesseract.sh
      - type: file
        path: io.github.Big_Onche.Tesseract-Continued.desktop
      - type: patch
        path: patches/gcc16.patch
      - type: patch
        path: patches/makefile-modernisation.patch
